[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caregrid"
version = "0.1.0"
description = "ICU bed-arbitration decision-support engine"
requires-python = ">=3.11"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["httpx>=0.27"]

[project.scripts]
caregrid = "caregrid.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
